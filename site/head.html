<title>Rotterdam Reistijdmatrix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  color-scheme:light;
  /* Kleuren uit de huisstijl van gemeente Rotterdam, overgenomen uit hun eigen
     stylesheet op rotterdam.nl (--color-green-01 t/m --color-gray-11). Het
     lettertype van de huisstijl (Bolder) is niet vrij te laden, dus daarvoor
     staat hier de bestaande zetting. */
  --ground:#eff4f6; --card:#fff; --sunken:#e4eef1;
  --ink:#001905; --ink-2:#536165; --ink-3:#7c8b90;
  --line:#dbe7ea; --line-2:#cad6da;
  --accent:#006e32; --accent-2:#ef7d00; --warn:#d99600; --warn-bg:#fdf6e3;
  --groen-licht:#e1efe2; --groen-rand:#99cca0;
  --surface-viz:#fff;
  /* De kleurschaal van de matrix. Eén tint, en de lichtheid loopt in dertien
     gelijke stappen van .955 naar .255 in OKLCH -- met de losse huisstijltinten
     lag het middenstuk te dicht op elkaar en werd de matrix een vlakte. */
  --ramp:#ddf9e0,#b3efb9,#90e198,#71d17a,#54c05e,#3aae45,#249b2e,#12881a,#0b750c,#0f6107,#154e0d,#1a3a15,#172813;
  --shadow:0 1px 2px rgba(0,25,5,.06),0 8px 24px -16px rgba(0,25,5,.30);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#07120c; --card:#0f1c14; --sunken:#0b1710;
  --ink:#eaf2ec; --ink-2:#9db0a4; --ink-3:#748379;
  --line:#1e2f24; --line-2:#2b402f;
  --accent:#11a03e; --accent-2:#ef7d00; --warn:#edb500; --warn-bg:#241f0c;
  --groen-licht:#12241a; --groen-rand:#27452f;
  --surface-viz:#0f1c14;
  --ramp:#172813,#1a3a15,#154e0d,#0f6107,#0b750c,#12881a,#249b2e,#3aae45,#54c05e,#71d17a,#90e198,#b3efb9,#ddf9e0;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#07120c; --card:#0f1c14; --sunken:#0b1710;
  --ink:#eaf2ec; --ink-2:#9db0a4; --ink-3:#748379;
  --line:#1e2f24; --line-2:#2b402f;
  --accent:#11a03e; --accent-2:#ef7d00; --warn:#edb500; --warn-bg:#241f0c;
  --groen-licht:#12241a; --groen-rand:#27452f;
  --surface-viz:#0f1c14;
  --ramp:#172813,#1a3a15,#154e0d,#0f6107,#0b750c,#12881a,#249b2e,#3aae45,#54c05e,#71d17a,#90e198,#b3efb9,#ddf9e0;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -16px rgba(0,0,0,.8);
}


/* ---- paginabalk en tabbladen ---- */
.topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center;
  gap:20px; padding:9px 0; margin:0 0 26px; background:var(--ground);
  border-bottom:1px solid var(--line)}
.merk{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink);
  flex-shrink:0}
.merkvlak{width:15px; height:15px; background:var(--accent); border-radius:2px}
.merknaam{font-family:Archivo,sans-serif; font-weight:600; font-size:14px;
  letter-spacing:-.01em; white-space:nowrap}
.tabs{display:flex; gap:2px; flex-wrap:wrap; flex-grow:1}
.tabs button{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  letter-spacing:.02em; padding:7px 12px; border:1px solid transparent;
  background:none; color:var(--ink-2); border-radius:2px; cursor:pointer;
  transition:.13s; white-space:nowrap}
.tabs button:hover{color:var(--ink); background:var(--sunken)}
.tabs button[aria-current="page"]{background:var(--accent); color:#fff}
.kalstand{display:flex; align-items:center; gap:7px; flex-shrink:0;
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-2)}
.kalpunt{width:7px; height:7px; border-radius:50%; background:var(--warn);
  flex-shrink:0}
.kalstand.klaar .kalpunt{background:var(--accent)}

.pagina{display:none}
.pagina.aan{display:block}
.pagina > section:first-of-type{margin-top:0}
.paginakop{margin:0 0 28px}
.paginakop h2{font-size:31px; letter-spacing:-.022em; margin:0 0 8px}

/* ---- voorblad ---- */
.mast{padding:20px 0 36px; border-bottom:none}
.knoppen{display:flex; flex-wrap:wrap; gap:8px; margin:30px 0 0}
.knop{font-family:Archivo,sans-serif; font-size:14px; font-weight:600;
  padding:11px 20px; border-radius:2px; border:1px solid var(--line-2);
  color:var(--ink-2); text-decoration:none; transition:.13s}
.knop:hover{border-color:var(--accent); color:var(--ink)}
.knop.primair{background:var(--accent); border-color:var(--accent); color:#fff}
.knop.primair:hover{background:var(--ink); border-color:var(--ink); color:#fff}
.melding{display:flex; align-items:baseline; gap:11px; margin:26px 0 0;
  padding:11px 15px; background:var(--warn-bg); border:1px solid var(--line);
  border-radius:3px; max-width:78ch}
.mlabel{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--warn); white-space:nowrap}
.mtekst{font-size:14.5px; color:var(--ink-2)}
.stat .d{display:block; margin-top:5px; font-size:12.5px; color:var(--ink-3)}

/* ---- auteursvermelding ---- */
.credit{margin:34px 0 0; padding:16px 0 0; border-top:1px solid var(--line);
  max-width:70ch}
.credit-rol{font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  margin-bottom:7px}
.credit-naam{font-family:Archivo,sans-serif; font-size:16px; color:var(--ink)}
.credit-fun{font-size:13.5px; color:var(--ink-2); margin-top:2px}

/* ---- werkblad ---- */
.werkblad{display:grid; grid-template-columns:270px minmax(0,1fr); gap:20px;
  align-items:start}
@media (max-width:860px){.werkblad{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex; flex-direction:column; gap:20px; position:sticky; top:64px;
  background:var(--card); border:1px solid var(--line); border-radius:3px;
  padding:18px; box-shadow:var(--shadow)}
@media (max-width:860px){.rail{position:static}}
.raildeel{display:flex; flex-direction:column}
.raillabel{font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  margin-bottom:9px}
.ctl.kolom{flex-direction:column; flex-wrap:nowrap; gap:3px; margin-bottom:0}
.ctl.kolom button{text-align:left}
.blad{display:flex; flex-direction:column; gap:20px; min-width:0}
.bladkop{display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:12px}
.bladkop .legend{margin:0}
.opslag{display:flex; flex-direction:column; gap:4px}
.opslag div{display:flex; justify-content:space-between; gap:10px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);
  padding:5px 9px; border:1px solid var(--line); border-radius:2px}
.opslag b{color:var(--ink); font-weight:500}

/* ---- analysekaarten ---- */
.analyses{display:grid; gap:14px}
.analyse{background:var(--card); border:1px solid var(--line); border-radius:3px;
  padding:20px 22px; box-shadow:var(--shadow)}
.analyse header{display:flex; align-items:baseline; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:12px}
.analyse h3{font-family:Archivo,sans-serif; font-size:18px; font-weight:600;
  letter-spacing:-.014em; margin:0}
.staat{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 9px; border-radius:2px; white-space:nowrap}
.staat.wacht{background:var(--warn-bg); color:var(--warn)}
.staat.uit{background:var(--groen-licht); color:var(--accent)}
.analyse .rijen{display:grid; grid-template-columns:100px minmax(0,1fr); gap:5px 14px;
  font-size:14px}
.analyse .rijen dt{font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
  padding-top:4px}
.analyse .rijen dd{margin:0; color:var(--ink-2); max-width:78ch}
.uitkomst{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  margin:14px 0 0; padding:13px 16px; background:var(--sunken);
  border:1px solid var(--line); border-radius:3px}
.uitkomst .groot{font-family:Archivo,sans-serif; font-size:27px; font-weight:600;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--ink)}
.uitkomst .bij{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--ink-2)}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px 96px}
h1,h2,h3,.disp{font-family:Archivo,"Helvetica Neue",Arial,sans-serif; text-wrap:balance}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* masthead */
.mast{padding:64px 0 36px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 18px}
h1{font-size:clamp(38px,6vw,60px); font-weight:700; letter-spacing:-.028em;
  line-height:1.02; margin:0 0 20px}
.lede{font-size:19px; color:var(--ink-2); max-width:62ch; margin:0}
.lede b{color:var(--ink); font-weight:600}

/* stat strip */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:3px; overflow:hidden; margin:36px 0 0}
.stat{background:var(--card); padding:18px 20px}
.stat .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:8px}
.stat .v{font-family:Archivo,sans-serif; font-size:30px; font-weight:600;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1}
.stat .u{font-size:14px; color:var(--ink-2); font-weight:500}

section{margin-top:56px}
h2{font-size:27px; font-weight:600; letter-spacing:-.018em; margin:0 0 6px}
.sub{color:var(--ink-2); max-width:64ch; margin:0 0 24px}
p{max-width:66ch}
.card{background:var(--card); border:1px solid var(--line); border-radius:3px;
  padding:22px; box-shadow:var(--shadow)}

/* controls */
.ctl{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.ctl button{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.02em;
  padding:7px 13px; border:1px solid var(--line-2); background:var(--card);
  color:var(--ink-2); border-radius:2px; cursor:pointer; transition:.13s}
.ctl button:hover{border-color:var(--accent); color:var(--ink)}
.ctl button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.scroller{overflow-x:auto; padding-bottom:4px}
canvas{display:block}
.viz-note{font-size:13.5px; color:var(--ink-3); margin:14px 0 0; max-width:70ch}

/* kaart */
.split{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:22px; align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.pick{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 10px}
.origin{font-family:Archivo,sans-serif; font-size:20px; font-weight:600;
  letter-spacing:-.015em; margin:0 0 14px; line-height:1.2}
.rank{list-style:none; padding:0; margin:0; display:grid; gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.rank li{background:var(--card); padding:7px 12px; display:flex;
  justify-content:space-between; gap:12px; font-size:13px; align-items:baseline}
.rank .t{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  color:var(--ink-2); white-space:nowrap}
.rank .z{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank .hd{background:var(--sunken); font-family:"IBM Plex Mono",monospace;
  font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}

/* verantwoording */
.uitleg{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:3px; overflow:hidden; margin-top:24px}
.uitleg .blok{background:var(--card); padding:20px 22px}
.uitleg h3{font-family:Archivo,sans-serif; font-size:17px; font-weight:600;
  letter-spacing:-.012em; margin:0 0 14px; display:flex; align-items:baseline; gap:10px}
.uitleg h3 .nr{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  font-weight:500; letter-spacing:.06em}
.uitleg dl{margin:0; display:grid; grid-template-columns:104px minmax(0,1fr); gap:9px 16px}
@media (max-width:600px){.uitleg dl{grid-template-columns:1fr; gap:3px 0}
  .uitleg dd{margin-bottom:11px}}
.uitleg dt{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); padding-top:3px}
.uitleg dd{margin:0; font-size:15px; color:var(--ink-2); max-width:68ch}
.uitleg dd b{color:var(--ink); font-weight:600}
.uitleg dd.straks{color:var(--accent)}
.uitleg dt.straks{color:var(--accent)}

/* voortgangslijst */
.prog{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:3px; overflow:hidden; margin-top:20px}
.prog .hd{background:var(--sunken); padding:8px 14px; font-family:"IBM Plex Mono",monospace;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.prog .row{background:var(--card); padding:9px 14px; display:grid;
  grid-template-columns:130px minmax(0,1fr) 118px; gap:14px; align-items:center}
@media (max-width:640px){.prog .row{grid-template-columns:110px minmax(0,1fr); }
  .prog .row .n{grid-column:1/-1; text-align:left}}
.prog .lab{font-size:13.5px}
.prog .track{position:relative; height:9px; background:var(--sunken);
  border-radius:5px; overflow:hidden}
.prog .fill{position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--accent)}
.prog .mark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--line-2)}
.prog .n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.prog .n b{color:var(--ink)}

/* heatmap legend */
.legend{display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap}
.legend .bar{height:10px; width:220px; border-radius:2px; border:1px solid var(--line)}
.legend .lab{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.swatch{display:inline-block; width:10px; height:10px; border-radius:2px;
  vertical-align:baseline; margin-right:6px}

/* tooltip */
.tip{position:fixed; pointer-events:none; z-index:50; background:var(--card);
  border:1px solid var(--line-2); border-radius:3px; padding:10px 12px;
  box-shadow:var(--shadow); font-size:13px; max-width:280px; opacity:0; transition:opacity .1s}
.tip.on{opacity:1}
.tip .t{font-family:Archivo,sans-serif; font-weight:600; font-size:13.5px; margin-bottom:5px}
.tip .r{display:flex; justify-content:space-between; gap:18px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2)}
.tip .r b{color:var(--ink); font-weight:600}

/* table */
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{text-align:left; padding:8px 12px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; white-space:nowrap}
td.n{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}

/* callout */
.warn{background:var(--warn-bg); border:1px solid var(--warn); border-left-width:3px;
  border-radius:3px; padding:18px 20px; margin-top:24px}
.warn .h{font-family:Archivo,sans-serif; font-weight:600; color:var(--warn);
  font-size:13px; letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px}
.warn p{margin:0; max-width:70ch; font-size:15px}

/* ledger list */
.ledger{list-style:none; padding:0; margin:0; display:grid; gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.ledger li{background:var(--card); padding:16px 20px; display:grid;
  grid-template-columns:minmax(0,1fr) auto; gap:8px 20px; align-items:baseline}
.ledger .n{font-family:Archivo,sans-serif; font-weight:600; font-size:15.5px}
.ledger .d{grid-column:1/-1; color:var(--ink-2); font-size:14.5px; max-width:72ch}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 8px; border-radius:2px; white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent)}
.tag.todo{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn)}

code{font-family:"IBM Plex Mono",monospace; font-size:.86em;
  background:var(--sunken); padding:1.5px 5px; border-radius:2px; border:1px solid var(--line)}
footer{margin-top:48px; padding-top:24px; border-top:1px solid var(--line);
  color:var(--ink-3); font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
